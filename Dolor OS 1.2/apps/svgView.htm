<!DOCTYPE html>
<html>
    <head>
        <title>Dolor OS SVG Viewer</title>
        <link rel="stylesheet" href="../resources/cursor/cursor.css">
        <style>
            :root {
                --visibility: initial;
            }

            .action-button.file {
                visibility: var(--visibility);
            }
            
            .viewport {
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
            }

            svg {
                height: 300px;
                width: 300px;
            }
        </style>
    </head>
    <body>
        <button style="background-color:red;font-family:'Lucida Sans','Lucida Sans Regular','Lucida Grande','Lucida Sans Unicode',Geneva,Verdana,sans-serif;" onclick="window.location.href='../main.html';">X</button>
        <div class="viewport" id="viewBox">
            <input readonly accept="*.svg" oninput="displayFile(this)" class="action-button file" type="file" id="pickSVG" />
        </div>
        <div class="win-cursor-container" id="winCursor">
            
            <svg class="cursor-state active" id="stateArrow" xmlns="http://w3.org" viewBox="0 0 32 32">
                <defs>
                    <filter id="win-shadow-arrow">
                        <feDropShadow dx="1" dy="1" stdDeviation="1" flood-color="#000000" flood-opacity="0.35"/>
                    </filter>
                </defs>
                <path d="M4 2 v20.4 l4.8 -4.8 l3.9 7.8 l1.8 -0.9 l-3.9 -7.7 h6.6 z" 
                      fill="#404040" 
                      stroke="#d6d6d6" 
                      stroke-width="1.5" 
                      stroke-linejoin="miter" 
                      filter="url(#win-shadow-arrow)"/>
            </svg>

            <svg class="cursor-state" id="stateHand" xmlns="http://w3.org" viewBox="0 0 32 32">
                <defs>
                    <filter id="win-shadow-hand">
                        <feDropShadow dx="1" dy="1" stdDeviation="0.8" flood-color="#000000" flood-opacity="0.3"/>
                    </filter>
                </defs>
                <path d="M10 3v9.5H9V5.5a1.5 1.5 0 0 0-3 0v11.7l-3.3-2.2a1.3 1.3 0 0 0-1.8.4 1.3 1.3 0 0 0 .4 1.8l5.5 4.1c1 .8 2.3 1.2 3.6 1.2h6.1a4.5 4.5 0 0 0 4.5-4.5V11a1.5 1.5 0 0 0-3 0v1h-1V9.5a1.5 1.5 0 0 0-3 0v1h-1V8a1.5 1.5 0 0 0-3 0z" 
                      fill="#404040" 
                      stroke="#d6d6d6" 
                      stroke-width="1.2" 
                    stroke-linejoin="round" 
                    filter="url(#win-shadow-hand)"/>
            </svg>

        </div>
        <script src="../resources/cursor/cursor.js"></script>
        <script>
            const filePicker = document.getElementById('pickSVG');
            const nDiv = document.getElementById('viewBox');

            function displayFile(ipnut) {
                const file = ipnut.files[0];
                let fileCodeString = ``;
                document.documentElement.style.setProperty('--visibility', 'hidden');

                if (file) {
                    const reader = new FileReader();

                    reader.onload = function(e){
                        fileCodeString = e.target.result;

                        process(fileCodeString);
                    };
                    reader.readAsText(file);
                }
            }

            function process(code) {
                nDiv.innerHTML += code;
            }
        </script>
    </body>
</html>
