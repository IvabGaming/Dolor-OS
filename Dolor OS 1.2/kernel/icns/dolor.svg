<svg xmlns="http://www.w3.org/2000/svg" width="50" height="50" viewBox="0 0 50 50">
    <defs>
        <!-- This defines the 'visible window' (everything from x=10 to the right edge) -->
        <clipPath id="hide-left-side">
            <rect x="10" y="0" width="40" height="50" />
        </clipPath>
    </defs>

    <rect height="45" y="2.5" width="5" x="10" fill="#888" stroke="#888" />
    
    <!-- Attached the clip-path here to clip off the left curve of the circle -->
    <circle r="22.5" cx="15" cy="25" fill="none" stroke-width="5" stroke="#888" clip-path="url(#hide-left-side)" />
    
    <rect height="5" width="20" fill="#888" stroke="none" x="4" y="45" />
    <rect height="5" width="20" fill="#888" stroke="none" x="2" y="0.25" />
</svg>
